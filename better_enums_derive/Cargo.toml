[package]
name = "better_enums_derive"
version = "0.2.1"
edition = "2024"
description = "This crate is not intended to use directly, use better_enums instead"
readme = "README.md"
license = "MIT OR Apache-2.0 "
repository = "https://github.com/tleisterer/better_enums.git"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = { version = "3.5.0", optional = true }

[features]
rename = ["dep:proc-macro-crate"]